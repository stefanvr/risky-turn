name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deployment needs to write Pages and mint an OIDC token; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gate drives two real browser tabs, so the browser has to be here.
      - run: pnpm exec playwright install --with-deps chromium

      # The same check that gates a goal locally gates a deployment here:
      # a build that fails typecheck or tests never reaches the public URL.
      - run: pnpm run check

      # Pages must already have "GitHub Actions" as its source; the default
      # workflow token is not permitted to turn Pages on by itself.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
